# Deploy:
#   cd workers/recruiter-chat
#   npx wrangler login
#   npx wrangler secret put LLM_API_KEY   # Gemini API key
#   npx wrangler deploy
# Then set RECRUITER.chatProxyUrl to the worker URL.

name = "recruiter-chat"
main = "src/index.js"
compatibility_date = "2026-09-06"

[vars]
ALLOWED_ORIGINS = "https://vasubansal1033.github.io,http://localhost:4321,http://127.0.0.1:4321"
GEMINI_MODEL = "gemini-2.0-flash"
